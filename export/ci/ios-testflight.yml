# 範例:用 GitHub Actions 的 macOS 機器建置 iOS 版並上傳 TestFlight(D10)。
#
# ⚠️ 未驗證:雲端工作環境沒有 macOS,也沒有 Apple 帳號。第一次使用時請預期要修正小地方。
# 啟用方法(由擁有人或整合工作階段決定):把這個檔案複製到 .github/workflows/ios-testflight.yml。
# 觸發:在 GitHub 的「Actions」分頁手動執行(workflow_dispatch),不會每次推送都跑。
#
# 需要在 GitHub repo 的「Settings → Secrets and variables → Actions」加入(值不要放進 repo):
#   APPLE_TEAM_ID                 Apple 開發者帳號的 Team ID(10 個字元)
#   ASC_KEY_ID                    App Store Connect API 金鑰的 Key ID
#   ASC_ISSUER_ID                 App Store Connect API 的 Issuer ID
#   ASC_KEY_P8_BASE64             API 金鑰檔(.p8)的 base64 內容(macOS:base64 -i AuthKey_XXXX.p8 | pbcopy)
# API 金鑰在 App Store Connect →「使用者與存取權限 → 整合 → App Store Connect API」產生,角色選「App 管理」。
# 用 API 金鑰時 Xcode 會自動建立簽署憑證與描述檔(cloud signing),不需要另外上傳 .p12 與描述檔。
#
# 費用:公開 repo 免費;私人 repo 的 macOS 分鐘數以 10 倍計算(免費額度很快用完),一次建置約 15 至 30 分鐘。

name: iOS TestFlight

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
  TEMPLATES_DIR: "4.7.2.stable"

jobs:
  build:
    # 需要有 Xcode 26 或以上的映像檔;請在 https://github.com/actions/runner-images 確認名稱。
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install Godot and export templates
        run: |
          mkdir -p "$RUNNER_TEMP/godot" && cd "$RUNNER_TEMP/godot"
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_macos.universal.zip"
          unzip -q godot.zip
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${TEMPLATES_DIR}"
          cp -R templates/* "$HOME/Library/Application Support/Godot/export_templates/${TEMPLATES_DIR}/"
          echo "GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Fill Team ID, build number and project-only export (CI copy only)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/^application\/app_store_team_id=\"\"/application\/app_store_team_id=\"${APPLE_TEAM_ID}\"/" export_presets.cfg
          sed -i '' "s/^application\/export_project_only=false/application\/export_project_only=true/" export_presets.cfg
          sed -i '' "s/^application\/version=\"1\"/application\/version=\"${GITHUB_RUN_NUMBER}\"/" export_presets.cfg

      - name: Export Xcode project with Godot
        run: |
          "$GODOT" --headless --path . --import || true
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/DoggyKnight.ipa
          ls build/ios

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project build/ios/DoggyKnight.xcodeproj -scheme DoggyKnight -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/DoggyKnight.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive

      - name: Upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/DoggyKnight.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
