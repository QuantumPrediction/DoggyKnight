name: Photograph the three heroes on Linux
on:
  pull_request:
    branches: ['codex/keyboard-choice-cards']
    types: [synchronize]
    paths: ['.github/workflows/verify-hero-motion.yml']
permissions:
  contents: read
jobs:
  render:
    if: github.repository == 'QuantumPrediction/DoggyKnight' && github.event.repository.private == false && github.head_ref == 'codex/storybook-combat-motion'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested public art and install the exact engine
        run: |
          set -euo pipefail
          source_sha=c6dacba728cab1afa404911e82b051aba58d0b89
          git init -q .
          git fetch -q --depth=1 https://github.com/QuantumPrediction/DoggyKnight.git "$source_sha"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$source_sha"
          stem=Godot_v4.7.2-stable_linux.x86_64
          curl -fsSL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$stem.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/$stem" "$RUNNER_TEMP/godot"
          "$RUNNER_TEMP/godot" --version | grep -F '4.7.2.stable.official.ed1daf0bf'
      - name: Render the five production views and check their geometry
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/render-profile"
          export ART_CAPTURE_DIR="$RUNNER_TEMP/stills"
          export LIBGL_ALWAYS_SOFTWARE=1
          engine="$RUNNER_TEMP/godot"
          "$engine" --headless --path . --import > "$RUNNER_TEMP/import.log" 2>&1
          xvfb-run -a -s '-screen 0 1280x1024x24' "$engine" --path . --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy res://tests/integration/combat_readability_showcase.tscn
          python3 - <<'PY'
          import hashlib, json, os, struct
          from pathlib import Path
          folder = Path(os.environ['ART_CAPTURE_DIR'])
          expected = {'archer_tracking': (540,960), 'archer_locked_focus_ready': (540,960), 'mage_roll_cooldown': (540,960), 'knight_small': (360,640), 'archer_notched': (390,844)}
          rows = json.loads((folder / 'checks.json').read_bytes())
          assert {r['capture'] for r in rows} == set(expected)
          assert all(r['safe'] and r['text_fits'] for r in rows)
          for name, dims in expected.items():
              data = (folder / (name + '.png')).read_bytes()
              assert data[:8] == bytes.fromhex('89504e470d0a1a0a') and struct.unpack('>II', data[16:24]) == dims
              assert len(data) < 3500000
              print('FRAME_SHA256', name, hashlib.sha256(data).hexdigest(), len(data))
          PY
      - name: Retain the native screenshot evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-hero-stills
          path: |
            ${{ runner.temp }}/stills/*.png
            ${{ runner.temp }}/stills/checks.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
