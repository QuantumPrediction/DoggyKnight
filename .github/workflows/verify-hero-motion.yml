name: Inspect the stored replay pairs
on:
  pull_request:
    branches: ['codex/keyboard-choice-cards']
    types: [synchronize]
    paths: ['.github/workflows/verify-hero-motion.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'QuantumPrediction/DoggyKnight' && github.event.repository.private == false && github.head_ref == 'codex/storybook-combat-motion'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect stored reports, entry saves and both process results without a replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/QuantumPrediction/DoggyKnight/actions/artifacts/14772085693/zip > "$RUNNER_TEMP/results.zip"
          echo "24a74594db2d25dc16f9dfea0266f1d2df93d5527cd25e82b68ec573f94e6098  $RUNNER_TEMP/results.zip" | sha256sum --check
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'results.zip') as files:
              for route in (0,1):
                  for kind in ('report','save'):
                      raw=files.read(f'before-{route}-{kind}.json')
                      candidate=files.read(f'after-{route}-{kind}.json')
                      print('RETAINED_PAIR',route,kind,raw==candidate,hashlib.sha256(raw).hexdigest(),hashlib.sha256(candidate).hexdigest(),len(raw),len(candidate),flush=True)
                      for version, item in [('before',raw),('after',candidate)]:
                          print('BEGIN_GAME_EVIDENCE',f'{version}-{route}-{kind}',flush=True)
                          print(item.decode().rstrip('\n'),flush=True)
                          print('END_GAME_EVIDENCE',flush=True)
                          if kind=='report':
                              obj=json.loads(item)
                              print('OBSERVED_ROUTE',version,route,obj['outcome'],obj['downs'],files.read(f'{version}-{route}-exit.txt').decode().strip(),flush=True)
          PY
